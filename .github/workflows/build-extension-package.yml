name: Build Extension Package

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-extension-package:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout selected branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
              with:
                  install-args: --frozen-lockfile

            - name: Create .env file
              run: printf 'POSTHOG_API_KEY=\n' > src/.env

            - name: Package Extension
              run: |
                  current_package_version=$(node -p "require('./src/package.json').version")
                  package_path="bin/roo-cline-${current_package_version}.vsix"
                  pnpm vsix

                  test -f "$package_path"
                  unzip -l "$package_path" > /tmp/roo-code-vsix-contents.txt

                  grep -q "extension/package.json" /tmp/roo-code-vsix-contents.txt
                  grep -q "extension/package.nls.json" /tmp/roo-code-vsix-contents.txt
                  grep -q "extension/dist/extension.js" /tmp/roo-code-vsix-contents.txt
                  grep -q "extension/webview-ui/audio/celebration.wav" /tmp/roo-code-vsix-contents.txt
                  grep -q "extension/webview-ui/build/assets/index.js" /tmp/roo-code-vsix-contents.txt
                  grep -q "extension/assets/codicons/codicon.ttf" /tmp/roo-code-vsix-contents.txt
                  grep -q "extension/assets/vscode-material-icons/icons/3d.svg" /tmp/roo-code-vsix-contents.txt
                  grep -q "extension/.env" /tmp/roo-code-vsix-contents.txt
                  rm /tmp/roo-code-vsix-contents.txt

            - name: Upload extension package
              uses: actions/upload-artifact@v4
              with:
                  name: roo-cline-${{ github.run_number }}
                  path: bin/roo-cline-*.vsix
                  if-no-files-found: error
                  retention-days: 30
